name: Update Mihomo Config

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 下载 Wiki
      - name: Download Wiki
        run: |
          curl -L \
          "https://raw.githubusercontent.com/wiki/Alvin9999-newpac/fanqiang/v2ray%E5%85%8D%E8%B4%B9%E8%B4%A6%E5%8F%B7.md" \
          -o source.md

      # 提取完整 URI
      - name: Extract Nodes
        run: |
          grep -Eo \
          '(vmess|vless|trojan|ss|ssr|hysteria|hysteria2|tuic|anytls)://[^[:space:]<>"'\'']+' \
          source.md \
          | sort -u \
          > nodes.txt

          echo "节点数量："
          wc -l nodes.txt

      # 下载 subconverter
      - name: Download subconverter
        run: |
          wget -q \
          https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz \
          -O subconverter.tar.gz

          tar -xzf subconverter.tar.gz

          chmod +x subconverter/subconverter

      # 启动 subconverter
      - name: Start subconverter
        run: |
          nohup ./subconverter/subconverter > subconverter.log 2>&1 &
          sleep 3

      # 把 nodes.txt 转换成 Mihomo
      - name: Convert to Mihomo
        run: |

          URL="file://$(realpath nodes.txt)"

          curl -G \
            "http://127.0.0.1:25500/sub" \
            --data-urlencode "target=clash" \
            --data-urlencode "url=$URL" \
            --data-urlencode "insert=false" \
            --data-urlencode "emoji=true" \
            --data-urlencode "scv=true" \
            --data-urlencode "fdn=false" \
            -o config.yaml

      # 检查转换结果
      - name: Check config
        run: |
          echo "config.yaml："

          head -50 config.yaml

          echo
          echo "Proxy 数量："

          grep -c "server:" config.yaml || true

      # 提交
      - name: Commit
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source.md nodes.txt config.yaml

          git commit \
            -m "Auto update Mihomo nodes" \
            || echo "No changes"

          git push
